[package]
name = "discord-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "system_fonts", "clipboard", "links"] }
egui = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "webpki-roots", "gzip", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tokio-tungstenite = { version = "0.23", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
futures-util = "0.3"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
dirs = "6"
chrono = "0.4"
qrcode = "0.14"
rsa = "0.9"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
audiopus = "0.3.0-rc.0"
cpal = "0.15"
libsodium-sys = "0.2"
socket2 = "0.5"
libc = "0.2"
rodio = "0.20"

[profile.release]
lto = true
codegen-units = 1
strip = true
